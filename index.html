function ao(){const u=$('au1').value.trim();if(!/^S000/i.test(u))return modal(st.cm?'Código de autorización inválido':'Usuario o contraseña incorrectos','ad()');const l=st.it[st.sel],v=st.pv;cm();if(v>=0){if(st.at=='p')l.p=v;else if(st.at=='dp')l.d=Math.min(100,v);else if(st.at=='dd'&&l.p>0)l.d=Math.min(100,v/l.p*100)}if(st.at=='ob')l.d=100;st.k2=0;st.inp='';draw()}
const TVP=()=>`<div class=a style="inset:0" onclick="st.tv=0;draw()"></div><div class=a style="left:268px;top:98px;width:116px;height:113px;background:#000;border-radius:3px"></div>`+bt(276,105,100,45,'Pedidos Pendientes','dk2 dd',"pp()")+bt(276,158,100,45,'Tiquete Venta','dk2',"tvs()");

 const B=[['C<u>o</u>nsultar',60,101],['<u>R</u>eimprimir',169,101],['C<u>a</u>ncelar',277,101],['<u>M</u>odificar<br>Vencimiento',386,101],['<u>V</u>ender Pedido',495,101],['<u>I</u>mprimir<br>Consulta',690,101],['<u>E</u>xportar a Excel',798,102]];
 $('sc').innerHTML=hd()+bt(60,52,44,45,'<svg width=26 height=26 viewBox="0 0 24 24"><path fill="#fff" d="M3 3h18l-7 9v7l-4 2v-9z"/></svg>')+bt(113,52,809,45,'Listado de Apartados / Pedidos / Cotizaciones','e')+bt(930,52,89,45,'✖','o',"go(st.pb||'sale')")+`<div class=a style="left:60px;top:105px;width:959px;height:643px;background:#fff;color:#000;overflow:hidden"><div style="height:40px;background:#efefef;padding:6px 8px"><span style="background:#fff;padding:4px 14px;font-size:17px">Documento &nbsp;▵</span></div><div style="display:flex;height:40px;border-bottom:1px solid #ddd;margin-left:12px">${C.map((c,i)=>`<div style="width:${W[i]}px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:1.1;border-left:1px solid #eee">${c}</div>`).join('')}</div><div class=a style="left:0;right:0;top:340px;text-align:center;color:#666;font-size:16px">(No hay datos para mostrar)</div><div class=a style="left:0;right:0;bottom:0;height:24px;background:#ddd"></div></div>`+B.map(b=>bt(b[1],757,b[2],45,b[0],'bk')).join('')+bt(907,757,52,45,cv(0),'bk')+bt(967,757,52,45,cv(1),'bk')}
function opc(){if(st.scr=='sale'||st.scr=='cl'){if(st.cl&&st.cl.def)st.cl=null;st.msg='';st.scr='cl';st.inp='';draw()}}
function go(x){st.mv='';st.k2=0;st.tv=0;st.scr=x;st.inp='';st.msg='';if(x=='pay'){if(!st.it.length)return go('sale');if(!st.cl){st.scr='sale';draw();return modal('Falta seleccionar el cliente para la venta')}st.m={n:'Efectivo USD',c:'USD'};st.sub=''}draw()}

function bs(){const e=$('in');e.value=e.value.slice(0,-1);if(!TOUCH)e.focus()}
function qa(x){$('in').value=x}
function pm(n){const T=tot();st.m={n,c:/CRC/.test(n)?'CRC':'USD'};st.inp=st.m.c=='CRC'?(T*TC).toFixed(3):T.toFixed(2);draw()}

function pd(){const v=parseFloat($('in').value);if(v>=0&&v<=100){st.it[st.sel].d=v;st.inp='';draw()}}
function dl(){st.it.splice(st.sel,1);st.sel=0;if(!st.it.length)st.t0=0;draw()}
function clr(){st.it=[];st.cl=null;st.t0=0;draw()}
function ent(){const q=$('in').value.trim(),s=st.scr;
 if(s=='bus'){st.q=q;st.res=srch(q);draw()}
 else if(s=='login'){if(q){st.v=q;go('sale')}}
 else if(s=='sale'){if(!q)return;const k=Object.keys(P).find(x=>x.toLowerCase()==q.toLowerCase()||P[x][2]==q);if(!k)return modal('Artículo no encontrado: '+q);
  
  add({k,n:P[k][0],p:P[k][1],cb:P[k][2],d:P[k][3],fam:P[k][4]});go('sale')}
 else if(s=='cl'){if(!q)return;const x=st.cli.find(c=>(c.nom+' '+c.tel+' '+c.idn+' '+c.mail).toLowerCase().includes(q.toLowerCase()));if(x)st.cl=x;else st.msg='Cliente no encontrado. Use el botón Nuevo para registrarlo.';st.inp='';draw()}
 else if(s=='pay'){const T=tot(),c=st.m.c=='CRC',due=c?T*TC:T,v=parseFloat(q)||due;if(v+1e-6<due)return modal('El importe es menor al total a pagar.');if(/AMEX|VISA|MASTERCARD/.test(st.m.n))return vc();fin(v-due)}}

function fin(ch){$('md').innerHTML=`<div class=mc><b style="font-size:20px">Venta finalizada ✔</b><p>Total: ${M(tot())} USD<br>Forma de pago: ${st.m.n}${ch>0.004?`<br>Cambio: ${M(R(ch))} ${st.m.c}`:''}</p><button onclick="nv()">Nueva venta</button></div>`}
